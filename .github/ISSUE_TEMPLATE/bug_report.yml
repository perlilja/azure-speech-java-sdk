name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Library version}
    validations: {required: true}
  - type: input
    id: java
    attributes: {label: Java version and OS}
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the ProtocolError kind and code if any. Never paste keys, tokens or audio.
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Minimal reproduction}
